<!doctype html><meta charset="utf-8"><title>Demo app</title>
<style>
body{margin:0;font-family:system-ui;background:#f4f5fb;color:#1c1d2b}
nav{height:70px;background:#fff;display:flex;align-items:center;padding:0 40px;gap:30px;box-shadow:0 1px 0 #e2e4f0}
nav b{font-size:24px}nav a{color:#555}
main{max-width:760px;margin:60px auto;background:#fff;padding:40px;border-radius:16px;box-shadow:0 10px 40px #0001}
label{display:block;margin:20px 0 6px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:14px;font-size:18px;border:1px solid #ccd;border-radius:10px}
button{margin-top:28px;padding:14px 28px;font-size:18px;background:#5b47ff;color:#fff;border:0;border-radius:10px}
#done{display:none;margin-top:24px;padding:16px;background:#e7f9ee;border-radius:10px}
</style>
<nav><b>Demo</b><a>Projects</a><a>Settings</a></nav>
<main><h1>New project</h1>
<label for=t>Title</label><input id=t><label for=s>Subject</label><input id=s>
<button id=go>Create</button><div id=done>Project created.</div></main>
<script>go.onclick=()=>setTimeout(()=>done.style.display='block',2500)</script>
