<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
const FONT = '"Inter","SF Pro Display",-apple-system,"Helvetica Neue",Arial,sans-serif';
let cv, g, W, H;
window.setup = (w, h) => { cv = document.getElementById('c'); cv.width = W = w; cv.height = H = h; g = cv.getContext('2d'); };

function wrap(text, maxW) {
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

function card(c, v) {
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#0b0d17'); bg.addColorStop(1, '#1b1040');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.globalAlpha = c.alpha; g.textAlign = 'center'; g.textBaseline = 'middle';
  const cx = W / 2; let y = H / 2 - (c.sub ? 40 : 0);
  const big = v ? 84 : 104;
  if (c.chapter) {
    g.fillStyle = '#8b7cff'; g.font = `700 ${v ? 36 : 40}px ${FONT}`;
    g.fillText(`CHAPTER ${String(c.chapter).padStart(2, '0')}`, cx, y - big * 1.1);
  }
  g.fillStyle = '#fff'; g.font = `800 ${big}px ${FONT}`;
  const lines = wrap(c.title, W * 0.8);
  lines.forEach((l, i) => g.fillText(l, cx, y + (i - (lines.length - 1) / 2) * big * 1.15));
  if (c.sub) {
    g.fillStyle = '#b9bdd6'; g.font = `500 ${v ? 40 : 44}px ${FONT}`;
    g.fillText(c.sub, cx, y + (lines.length / 2) * big * 1.15 + 50);
  }
  g.fillStyle = '#8b7cff'; rr(cx - 60, y + (lines.length / 2) * big * 1.15 + (c.sub ? 110 : 50), 120, 6, 3); g.fill();
  g.globalAlpha = 1;
}

function caption(c, v) {
  g.globalAlpha = c.alpha;
  const fs = v ? 54 : 44; g.font = `600 ${fs}px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'middle';
  const lines = wrap(c.text, v ? 820 : 1400);
  const tw = Math.max(...lines.map((l) => g.measureText(l).width));
  const padX = 44, padY = 28, lh = fs * 1.3;
  const bw = tw + padX * 2 + 14, bh = lines.length * lh + padY * 2;
  const x = (W - bw) / 2, y = H - bh - (v ? 300 : 90) + (1 - c.alpha) * 14;
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 30; g.shadowOffsetY = 8;
  g.fillStyle = 'rgba(11,13,23,.88)'; rr(x, y, bw, bh, 22); g.fill();
  g.shadowColor = 'transparent';
  g.fillStyle = '#8b7cff'; rr(x + 18, y + 22, 6, bh - 44, 3); g.fill();
  g.fillStyle = '#fff';
  lines.forEach((l, i) => g.fillText(l, x + padX + 14, y + padY + lh * (i + 0.5)));
  g.globalAlpha = 1;
}

function ripple(r, z) {
  const e = 1 - (1 - r.age) ** 3;
  const rad = (26 + 90 * e) * Math.sqrt(z);
  g.lineWidth = 6 * (1 - r.age) + 1;
  g.strokeStyle = `rgba(139,124,255,${0.95 * (1 - r.age)})`;
  g.beginPath(); g.arc(r.x, r.y, rad, 0, 7); g.stroke();
  g.fillStyle = `rgba(139,124,255,${0.22 * (1 - r.age)})`;
  g.beginPath(); g.arc(r.x, r.y, rad * 0.8, 0, 7); g.fill();
}

function cursor(p, press, z) {
  const s = (1 + 0.22 * (z - 1)) * (1 - 0.14 * press) * 1.25;
  g.save(); g.translate(p.x, p.y); g.scale(s, s);
  g.shadowColor = 'rgba(0,0,0,.4)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 27); g.lineTo(7, 21); g.lineTo(12, 33); g.lineTo(17, 31); g.lineTo(12, 20); g.lineTo(21, 20); g.closePath();
  g.fillStyle = '#111'; g.fill(); g.shadowColor = 'transparent';
  g.lineWidth = 2.4; g.strokeStyle = '#fff'; g.lineJoin = 'round'; g.stroke();
  g.restore();
}

window.draw = (s) => {
  g.clearRect(0, 0, W, H);
  if (s.card) return card(s.card, s.vertical);
  (s.ripples || []).forEach((r) => ripple(r, s.z));
  if (s.cursor) cursor(s.cursor, s.press, s.z);
  if (s.caption) caption(s.caption, s.vertical);
};
</script>
